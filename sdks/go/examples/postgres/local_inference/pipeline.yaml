# Real-Time Streaming Fraud Inference in Declarative Beam YAML
#
# Use Case:
# Evaluates statistical fraud risk model on incoming payments directly in worker
# memory with zero external RPC overhead, writing predictions back to PostgreSQL.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgreSQLCDC
      name: IngestPaymentsCDC
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        slot_name: "fraud_inference_slot"
        publication: "fraud_inference_pub"

    - type: Filter
      name: FilterValidPayments
      config:
        language: python
        keep: "operation in ('INSERT', 'UPDATE') and float(amount) > 0"

    - type: Sql
      name: EvaluateFraudRiskModel
      config:
        query: |
          SELECT
            payment_id,
            account_id,
            amount,
            1.0 / (1.0 + EXP(-(-3.5 + 0.002 * amount + 0.05 * distance_from_home_km + 1.2 * (CASE WHEN is_international THEN 1.0 ELSE 0.0 END)))) AS fraud_probability,
            CASE
              WHEN 1.0 / (1.0 + EXP(-(-3.5 + 0.002 * amount + 0.05 * distance_from_home_km + 1.2 * (CASE WHEN is_international THEN 1.0 ELSE 0.0 END)))) >= 0.85 THEN 'HIGH_RISK_BLOCK'
              WHEN 1.0 / (1.0 + EXP(-(-3.5 + 0.002 * amount + 0.05 * distance_from_home_km + 1.2 * (CASE WHEN is_international THEN 1.0 ELSE 0.0 END)))) >= 0.50 THEN 'SUSPICIOUS_REVIEW'
              ELSE 'LOW_RISK_CLEAR'
            END AS risk_tier,
            CURRENT_TIMESTAMP AS scored_at
          FROM PCOLLECTION

    - type: WriteToPostgreSQL
      name: SinkFraudPredictions
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.payment_fraud_predictions"
        conflict_keys:
          - "payment_id"

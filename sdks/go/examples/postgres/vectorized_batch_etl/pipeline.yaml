# High-Throughput Batch ETL & Transformation in Declarative Beam YAML
#
# Use Case:
# Bulk migration pipeline reading raw source transactions, standardizing
# currency codes and tiers, and bulk-upserting into `migrated_transactions`.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgres
      name: ReadSourceTransactions
      config:
        url: "jdbc:postgresql://localhost:5432/postgres"
        table: "test_pipelines.source_orders"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"

    - type: MapToFields
      name: StandardizeAndEnrich
      config:
        language: python
        fields:
          id: "int(order_id)"
          code: "str(country_code).upper()"
          amount: "round(float(amount), 2)"
          region: "'NORTH_AMERICA' if str(country_code).upper() in ('US', 'CA') else 'INTERNATIONAL'"
          tier: "'VIP' if float(amount) >= 1000.0 else 'STANDARD'"
          loaded_at: "datetime.datetime.now(datetime.timezone.utc).isoformat()"

    - type: WriteToPostgreSQL
      name: BulkUpsertTarget
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.migrated_transactions"
        conflict_keys:
          - "id"

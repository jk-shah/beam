# Dead-Letter Queue (DLQ) & Anomaly Routing in Declarative Beam YAML
#
# Use Case:
# Validates incoming records, routing conforming transactions to `clean_payments`
# and malformed or anomalous records to `dead_letter_payments` with error classifications.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgreSQLCDC
      name: IngestIncomingPayments
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        username: "beam_test"
        password_env_var: "PGPASSWORD"
        slot_name: "payments_dlq_slot"
        publication: "payments_pub"

    - type: Filter
      name: FilterCleanPayments
      config:
        language: python
        keep: "float(amount) > 0 and currency in ('USD', 'EUR', 'GBP') and status == 'COMPLETED'"

    - type: WriteToPostgreSQL
      name: SinkCleanPayments
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        username: "beam_test"
        password_env_var: "PGPASSWORD"
        table: "public.clean_payments"
        conflict_keys:
          - "payment_id"

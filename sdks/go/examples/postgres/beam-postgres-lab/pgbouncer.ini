[databases]
beammeup = host=postgres port=5432 dbname=beammeup
postgres = host=postgres port=5432 dbname=beammeup
quickstart = host=postgres port=5432 dbname=quickstart

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
ignore_startup_parameters = extra_float_digits, search_path

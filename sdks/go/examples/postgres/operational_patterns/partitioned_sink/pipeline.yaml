# Partitioned Table Sink with Composite Conflict Target in Declarative Beam YAML
#
# Use Case:
# Sinks records into PostgreSQL declarative partitioned tables (PARTITION BY RANGE).
# Enforces composite conflict target [order_id, order_date] matching the table's
# composite primary key required by PostgreSQL partitioning semantics.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: Create
      name: GeneratePartitionedRecords
      config:
        elements:
          - order_id: 1001
            order_date: "2026-09-01"
            customer_id: "USER-001"
            total_amount: 149.99
          - order_id: 1002
            order_date: "2026-09-02"
            customer_id: "USER-002"
            total_amount: 89.50
          - order_id: 1003
            order_date: "2026-09-03"
            customer_id: "USER-003"
            total_amount: 210.00

    - type: WriteToPostgreSQL
      name: SinkToPartitionedTable
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.orders_partitioned"
        primary_key_columns: ["order_id", "order_date"]
        write_mode: "UPSERT"
        batch_size: 1000

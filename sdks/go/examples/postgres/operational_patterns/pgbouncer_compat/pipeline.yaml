# PgBouncer Transaction Pooling Compatibility in Declarative Beam YAML
#
# Use Case:
# Sinks high-throughput event streams through PgBouncer in transaction pooling mode.
# Configures use_pgbouncer: true to suppress prepared statement caching and enforce
# transaction-scoped staging tables (ON COMMIT DROP).
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: Create
      name: GenerateSourceEvents
      config:
        elements:
          - event_id: 101
            source: "worker-1"
            payload: "telemetry_metric_alpha"
          - event_id: 102
            source: "worker-2"
            payload: "telemetry_metric_beta"
          - event_id: 103
            source: "worker-3"
            payload: "telemetry_metric_gamma"

    - type: WriteToPostgreSQL
      name: SinkViaPgBouncer
      config:
        host: "localhost"
        port: 6432
        database: "beammeup"
        username: "beam_transporter"
        password_env_var: "PGPASSWORD"
        table: "public.pooled_events"
        primary_key_columns: ["event_id"]
        write_mode: "UPSERT"
        use_pgbouncer: true
        batch_size: 1000

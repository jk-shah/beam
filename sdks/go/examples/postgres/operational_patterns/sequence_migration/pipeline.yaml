# Database Sequence & Identity Reconciliation in Declarative Beam YAML
#
# Use Case:
# Bulk loading or logical replication populates primary key values directly without
# advancing PostgreSQL sequence counters (SERIAL, BIGSERIAL, IDENTITY).
# This pipeline sinks migrated data and computes the maximum primary key to generate
# the required SELECT setval(...) statement, preventing primary key collisions at cutover.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: Create
      name: GenerateMigratedRecords
      config:
        elements:
          - order_id: 100001
            description: "order_migration_alpha"
          - order_id: 100002
            description: "order_migration_beta"
          - order_id: 100050
            description: "order_migration_gamma"

    - type: WriteToPostgresIO
      name: SinkMigratedOrders
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.orders_sequence_demo"
        conflict_keys: ["order_id"]
        write_mode: "UPSERT"
        max_batch_rows: 1000

# Schema Evolution & Adaptive Ingestion in Declarative Beam YAML
#
# Use Case:
# Handles mid-stream database schema modifications (e.g. ALTER TABLE orders ADD COLUMN loyalty_tier).
# Applies resilient field projection with safe defaults for older record versions and dynamic
# accommodation of schema expansions.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgreSQLCDC
      name: IngestAdaptiveCDC
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        username: "beam_test"
        password_env_var: "PGPASSWORD"
        slot_name: "schema_evolution_slot"
        publication: "orders_pub"

    - type: Filter
      name: FilterMutations
      config:
        language: "python"
        keep: "operation in ('INSERT', 'UPDATE')"

    - type: MapToFields
      name: AdaptSchemaVersions
      config:
        language: "python"
        fields:
          order_id: "int(after.get('order_id', 0))"
          customer_id: "str(after.get('customer_id', 'UNKNOWN'))"
          amount: "float(after.get('amount', 0.0))"
          loyalty_tier: "str(after.get('loyalty_tier', 'STANDARD'))"
          schema_ver: "2 if 'loyalty_tier' in after else 1"

    - type: WriteToPostgreSQL
      name: SinkToEvolvedTarget
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        username: "beam_test"
        password_env_var: "PGPASSWORD"
        table: "public.evolved_orders"
        primary_key_columns: ["order_id"]
        write_mode: "UPSERT"
        batch_size: 1000

# Database Bootstrap & Cutover Pattern in Declarative Beam YAML
#
# Use Case:
# Solves the cold-start bootstrapping problem when migrating or replicating a database table.
# Combines an initial consistent snapshot read with continuous logical replication CDC streaming,
# preventing race conditions and duplicate writes via primary-key deduplication.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgresCDC
      name: IngestCutoverCDCStream
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        slot_name: "backfill_cutover_slot"
        publication: "backfill_orders_pub"

    - type: Filter
      name: FilterValidMutations
      config:
        language: "python"
        keep: "operation in ('INSERT', 'UPDATE')"

    - type: MapToFields
      name: ProjectOrderAttributes
      config:
        language: "python"
        fields:
          order_id: "int(after['order_id'])"
          customer_id: "str(after['customer_id'])"
          amount: "float(after['amount'])"
          status: "str(after['status'])"

    - type: WriteToPostgresIO
      name: SinkToTargetTable
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.target_orders"
        conflict_keys: ["order_id"]
        write_mode: "UPSERT"
        max_batch_rows: 2000

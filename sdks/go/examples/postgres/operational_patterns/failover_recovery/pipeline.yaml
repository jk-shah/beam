# High Availability Failover Resilience in Declarative Beam YAML
#
# Use Case:
# Connects to high-availability PostgreSQL clusters (PostgreSQL 17+) using failover-synchronized
# logical replication slots (failover_slot: true). Reconnecting workers seamlessly resume replication
# from the newly promoted standby's mirrored slot without data loss or pipeline restarts.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgresCDC
      name: IngestFromHAFailoverSlot
      config:
        host: "pg-ha.internal"
        port: 5432
        database: "beammeup"
        username: "scotty"
        password_env_var: "PGPASSWORD"
        slot_name: "ha_failover_slot"
        publication: "ha_critical_pub"
        failover_slot: true

    - type: Filter
      name: FilterMutations
      config:
        language: "python"
        keep: "operation in ('INSERT', 'UPDATE')"

    - type: MapToFields
      name: ExtractHAFields
      config:
        language: "python"
        fields:
          record_id: "int(after['record_id'])"
          payload: "str(after['payload'])"

    - type: WriteToPostgresIO
      name: SinkToTargetTable
      config:
        host: "pg-ha.internal"
        port: 5432
        database: "beammeup"
        username: "scotty"
        password_env_var: "PGPASSWORD"
        table: "public.ha_replicated_orders"
        conflict_keys: ["record_id"]
        write_mode: "UPSERT"
        max_batch_rows: 1000

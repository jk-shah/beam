services:
  postgres:
    image: postgres:17
    container_name: quickstart-postgres
    environment:
      POSTGRES_DB: quickstart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=8
      -c max_wal_senders=8
      -c max_slot_wal_keep_size=1024MB
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quickstart"]
      interval: 2s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: ../../../../..
      dockerfile: sdks/go/examples/postgres/quickstart/Dockerfile
    container_name: quickstart-pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: secret
    restart: on-failure

# Slowly Changing Dimensions Type 2 (SCD2) in Declarative Beam YAML
#
# Use Case:
# Maintains non-destructive audit history for customer dimensions, tracking
# version numbers, `valid_from`, `valid_to`, and `is_current` flags in PostgreSQL.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgreSQLCDC
      name: IngestCustomerDimensionMutations
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        username: "beam_test"
        password_env_var: "PGPASSWORD"
        slot_name: "customers_scd2_slot"
        publication: "customers_pub"

    - type: Sql
      name: GenerateVersionedSCD2Records
      config:
        query: |
          SELECT
            customer_id,
            CAST(version AS INTEGER) AS version,
            full_name,
            tier,
            address,
            valid_from,
            COALESCE(valid_to, TIMESTAMP '9999-12-31 23:59:59Z') AS valid_to,
            CASE WHEN valid_to IS NULL THEN TRUE ELSE FALSE END AS is_current
          FROM PCOLLECTION

    - type: WriteToPostgreSQL
      name: SinkCustomerHistory
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        username: "beam_test"
        password_env_var: "PGPASSWORD"
        table: "public.customer_dim_history"
        conflict_keys:
          - "customer_id"
          - "version"

# Stream Deduplication & Idempotent Upsert in Declarative Beam YAML
#
# Use Case:
# Eliminates at-least-once duplicate messages in upstream message streams
# and performs atomic `ON CONFLICT (event_id) DO UPDATE` writes to PostgreSQL.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgresCDC
      name: IngestRawEvents
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        slot_name: "events_dedup_slot"
        publication: "events_pub"

    - type: Sql
      name: DeduplicateByEventID
      config:
        query: |
          SELECT
            event_id,
            ANY_VALUE(source) AS source,
            ANY_VALUE(payload) AS payload,
            MAX(created_at) AS created_at
          FROM PCOLLECTION
          GROUP BY event_id

    - type: WriteToPostgresIO
      name: SinkCanonicalEvents
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.canonical_events"
        conflict_keys:
          - "event_id"

# Window Function Top-N Ranking per Category in Declarative Beam YAML
#
# Use Case:
# Computes deterministic Top-N product ranking per category partition using
# SQL window ranking functions and performs atomic upsert into `top_products_by_category`.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgresCDC
      name: IngestProductsCDC
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        slot_name: "products_topn_slot"
        publication: "products_pub"

    - type: Sql
      name: RankTopProductsByCategory
      config:
        query: |
          WITH Ranked AS (
            SELECT
              category,
              product_id,
              product_name,
              sales_volume,
              ROW_NUMBER() OVER (PARTITION BY category ORDER BY sales_volume DESC) AS rank_position
            FROM PCOLLECTION
          )
          SELECT
            category,
            CAST(rank_position AS INTEGER) AS rank_position,
            product_id,
            product_name,
            sales_volume,
            CURRENT_TIMESTAMP AS updated_at
          FROM Ranked
          WHERE rank_position <= 10

    - type: WriteToPostgresIO
      name: SinkTopProducts
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.top_products_by_category"
        conflict_keys:
          - "category"
          - "rank_position"

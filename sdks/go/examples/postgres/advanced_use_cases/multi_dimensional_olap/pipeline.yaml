# Multi-Dimensional OLAP Sales Cube in Declarative Beam YAML
#
# Use Case:
# Computes composite dimensional rollups (total revenue, order count, average order value)
# grouped by `(region, category)` and atomic upsert into `olap_sales_cube`.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgresCDC
      name: IngestSalesOrdersCDC
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        slot_name: "olap_sales_slot"
        publication: "sales_pub"

    - type: Sql
      name: ComputeSalesCubeRollup
      config:
        query: |
          SELECT
            region,
            category,
            SUM(amount) AS total_revenue,
            COUNT(*) AS order_count,
            AVG(amount) AS avg_order_value,
            MAX(amount) AS max_order_value,
            CURRENT_TIMESTAMP AS computed_at
          FROM PCOLLECTION
          WHERE operation IN ('INSERT', 'UPDATE')
          GROUP BY region, category

    - type: WriteToPostgresIO
      name: SinkSalesCube
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.olap_sales_cube"
        conflict_keys:
          - "region"
          - "category"

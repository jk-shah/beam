# Real-Time Streaming Materialized View in Declarative Beam YAML
#
# Use Case:
# Replaces expensive and write-locking PostgreSQL `REFRESH MATERIALIZED VIEW` commands
# with an incremental, off-database stream aggregation engine.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgreSQLCDC
      name: IngestTransactionsCDC
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        username: "beam_test"
        password_env_var: "PGPASSWORD"
        slot_name: "beam_mv_slot"
        publication: "transactions_pub"

    - type: Sql
      name: ComputeMaterializedViewRollup
      config:
        query: |
          SELECT
            merchant_id,
            TUMBLE_START(event_timestamp, INTERVAL '1' MINUTE) AS window_start,
            TUMBLE_END(event_timestamp, INTERVAL '1' MINUTE) AS window_end,
            COUNT(*) AS transaction_count,
            SUM(amount) AS total_amount,
            MAX(amount) AS max_amount
          FROM PCOLLECTION
          WHERE operation IN ('INSERT', 'UPDATE')
          GROUP BY
            merchant_id,
            TUMBLE(event_timestamp, INTERVAL '1' MINUTE)

    - type: WriteToPostgreSQL
      name: MaintainMaterializedViewTable
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        username: "beam_test"
        password_env_var: "PGPASSWORD"
        table: "public.merchant_minute_rollups"
        conflict_keys:
          - "merchant_id"
          - "window_start"

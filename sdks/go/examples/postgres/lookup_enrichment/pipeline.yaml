# Dynamic PostgreSQL Lookup & Dimension Enrichment in Declarative Beam YAML
#
# Use Case:
# Ingests live orders via PostgreSQL CDC, performs relational enrichment against
# the `customer_profiles` dimension table, and outputs atomic upserts to `enriched_orders`.
#
# Execution:
#   python3 -m apache_beam.yaml.main --yaml_pipeline_file=pipeline.yaml

pipeline:
  type: chain
  transforms:
    - type: ReadFromPostgresCDC
      name: IngestOrdersCDC
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        slot_name: "orders_enrichment_slot"
        publication: "orders_pub"

    - type: Filter
      name: FilterValidOrders
      config:
        language: python
        keep: "operation in ('INSERT', 'UPDATE') and float(amount) > 0"

    - type: Sql
      name: EnrichWithCustomerProfiles
      config:
        query: |
          SELECT
            orders.order_id,
            orders.customer_id,
            COALESCE(cust.customer_name, 'Unknown') AS customer_name,
            COALESCE(cust.customer_email, 'unknown@example.com') AS customer_email,
            COALESCE(cust.loyalty_tier, 'STANDARD') AS loyalty_tier,
            orders.item,
            orders.amount,
            CURRENT_TIMESTAMP AS enriched_at
          FROM PCOLLECTION AS orders
          LEFT JOIN public.customer_profiles AS cust ON orders.customer_id = cust.customer_id

    - type: WriteToPostgresIO
      name: SinkEnrichedOrders
      config:
        host: "localhost"
        port: 5432
        database: "beammeup"
        username: "beam_navigator"
        password_env_var: "PGPASSWORD"
        table: "public.enriched_orders"
        conflict_keys:
          - "order_id"

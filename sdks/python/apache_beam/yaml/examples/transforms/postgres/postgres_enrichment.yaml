# PostgreSQL Ingestion, Relational Enrichment, and Target Analytics Sink
#
# Pipeline Architecture:
# 1. Source (PostgreSQL):
#    Captures incoming transactions continuously via PostgreSQL logical replication (CDC).
#
# 2. Mid-Pipeline Data Enrichment (PostgreSQL Dimension Join / Side Input):
#    Joins each transaction against the `public.customer_profiles` reference table in PostgreSQL
#    to fetch customer name, loyalty tier, credit limit, and risk score.
#
# 3. Sink (PostgreSQL):
#    Writes enriched transactions into `public.enriched_orders` using staged COPY upsert.

pipeline:
  type: chain
  transforms:
    # 1. Source: Continuous CDC Replication from PostgreSQL
    - type: ReadFromPostgreSQLCDC
      name: IngestOrdersCDC
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        slot_name: "orders_enrichment_slot"
        publication: "orders_pub"
        username: "beam_test"
        password: "beam_password"
        output_format: "row"

    # 2. Filter & Normalize Order Events
    - type: Filter
      name: FilterActiveOrders
      config:
        language: "python"
        keep: "operation in ('INSERT', 'UPDATE') and amount > 0"

    # 3. Relational SQL Join with Customer Dimension Table
    - type: Sql
      name: EnrichWithCustomerDimensions
      config:
        query: >
          SELECT
            orders.order_id,
            orders.customer_id,
            COALESCE(cust.customer_name, 'Unregistered Customer') AS customer_name,
            COALESCE(cust.customer_email, 'guest@example.com')    AS customer_email,
            COALESCE(cust.loyalty_tier, 'STANDARD')               AS loyalty_tier,
            COALESCE(cust.credit_limit, 500.0)                    AS credit_limit,
            COALESCE(cust.risk_score, 50.0)                       AS risk_score,
            orders.item,
            orders.amount,
            CASE
              WHEN orders.amount <= COALESCE(cust.credit_limit, 500.0)
                   AND COALESCE(cust.risk_score, 50.0) < 75.0
              THEN TRUE
              ELSE FALSE
            END AS is_approved,
            CURRENT_TIMESTAMP AS enriched_at
          FROM orders
          LEFT JOIN customer_profiles AS cust
            ON orders.customer_id = cust.customer_id

    # 4. Sink: Idempotent Atomic Upsert into Target PostgreSQL Table
    - type: WriteToPostgreSQL
      name: SinkEnrichedOrders
      config:
        host: "localhost"
        port: 5432
        database: "postgres"
        table: "public.enriched_orders"
        username: "beam_test"
        password: "beam_password"
        write_mode: "upsert"
        primary_key_cols: ["order_id"]
        batch_size: 2000

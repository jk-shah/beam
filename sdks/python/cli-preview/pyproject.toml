[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "apache-beam-cli-preview"
version = "0.2.0"
description = "Fast (<90ms) pure-Python preview overlay for the Apache Beam CLI (`beam` & `apache-beam`)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "apache-beam[yaml]>=2.71.0",
  "pyarrow>=14.0.0",
  "fastavro>=1.8.0",
]

[project.optional-dependencies]
gcp = [
  "apache-beam[yaml,gcp]>=2.71.0",
]
# Optional local SQL engine for `beam pipe --sql --sql-engine duckdb`.
duckdb = [
  "duckdb>=1.1",
]

[project.scripts]
beam = "apache_beam_cli_preview.launcher:main"
apache-beam = "apache_beam_cli_preview.launcher:main"
beam-demo = "apache_beam_cli_preview.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apache_beam_cli_preview*"]

name: Beam CLI Cross-Platform CI (Linux, Windows, macOS)

on:
  push:
    branches: ['beam-cli-preview']
    paths:
      - 'sdks/python/apache_beam/cli/**'
      - 'sdks/python/cli-preview/**'
      - 'sdks/python/_apache_beam_cli.py'
      - '.github/workflows/beam_CLI_CrossPlatform_CI.yml'
  pull_request:
    paths:
      - 'sdks/python/apache_beam/cli/**'
      - 'sdks/python/cli-preview/**'
      - 'sdks/python/_apache_beam_cli.py'
      - '.github/workflows/beam_CLI_CrossPlatform_CI.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  lint:
    name: Apache Beam Lint & License Gate (ruff + whitespacelint + ASF)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sdks/python/apache_beam/cli
            sdks/python/cli-preview
            sdks/python/_apache_beam_cli.py
            sdks/python/pyproject.toml
            sdks/python/setup.cfg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Apache Beam lint tools
        run: python -m pip install --upgrade pip ruff==0.15.22 whitespacelint yapf==0.43.0
      - name: Run Apache Beam ruff check
        run: ruff check sdks/python/apache_beam/cli sdks/python/cli-preview sdks/python/_apache_beam_cli.py --config sdks/python/pyproject.toml
      - name: Run whitespacelint, TOML validation & ASF license header checks
        run: |
          python - << 'PY'
          import glob, sys, tomllib
          files = sorted(
              glob.glob('sdks/python/apache_beam/cli/*.py') +
              glob.glob('sdks/python/cli-preview/apache_beam_cli_preview/*.py') +
              glob.glob('sdks/python/cli-preview/*.sh') +
              [
                  'sdks/python/_apache_beam_cli.py',
                  'sdks/python/cli-preview/setup.py',
                  'sdks/python/cli-preview/pyproject.toml',
                  'sdks/python/cli-preview/MANIFEST.in',
              ]
          )
          tomllib.loads(open('sdks/python/cli-preview/pyproject.toml', encoding='utf-8').read())
          errs = []
          for f in files:
            raw = open(f, encoding='utf-8').read()
            if 'Licensed to the Apache Software Foundation' not in raw[:1200]:
              errs.append(f'{f}: missing ASF 2.0 license header')
            for i, line in enumerate(raw.splitlines(), 1):
              if line != line.rstrip(' \t'):
                errs.append(f'{f}:{i}: trailing whitespace')
              if '\t' in line:
                errs.append(f'{f}:{i}: tab character')
          for tf in sorted(glob.glob('sdks/python/apache_beam/cli/*_test.py')):
            txt = open(tf, encoding='utf-8').read()
            if 'import unittest' in txt and 'unittest.main' not in txt:
              errs.append(f'{tf}: missing unittest.main()')
          if errs:
            print('\n'.join(errs), file=sys.stderr)
            sys.exit(1)
          print(f'Verified ASF headers, whitespace, and unittest.main() across {len(files)} files.')
          PY

  pytest-cross-platform:
    name: Pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sdks/python/apache_beam/cli
            sdks/python/cli-preview
            sdks/python/_apache_beam_cli.py
            sdks/python/pyproject.toml
            sdks/python/setup.cfg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Apache Beam & Test Dependencies
        run: |
          python -m pip install --upgrade pip build wheel
          python -m pip install "apache-beam[yaml,dataframe,gcp]>=2.68.0" pytest pytest-xdist duckdb deltalake jinja2 pyyaml pyarrow fastavro
      - name: Verify Isolated sdist -> wheel Build & Install Smoke Check
        run: |
          python - << 'PY'
          import glob, shutil, subprocess, sys, tarfile, tempfile, zipfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
            sdist_dir = Path(tmp) / 'sdist'
            subprocess.check_call([
                sys.executable, '-m', 'build', '--no-isolation', '--sdist',
                '--outdir', str(sdist_dir), './sdks/python/cli-preview'
            ])
            sdists = list(sdist_dir.glob('*.tar.gz'))
            assert len(sdists) == 1, sdists
            extracted = Path(tmp) / 'extracted'
            with tarfile.open(sdists[0], 'r:gz') as tf:
              tf.extractall(extracted)
            unpacked_src = next(extracted.iterdir())
            whl_dir = Path(tmp) / 'wheel'
            subprocess.check_call([
                sys.executable, '-m', 'build', '--no-isolation', '--wheel',
                '--outdir', str(whl_dir), str(unpacked_src)
            ])
            whls = list(whl_dir.glob('*.whl'))
            assert len(whls) == 1, whls
            with zipfile.ZipFile(whls[0], 'r') as zf:
              names = set(zf.namelist())
            assert 'apache_beam_cli_preview.pth' in names
            assert 'apache_beam_cli_preview/_bundled_cli/main.py' in names
            subprocess.check_call([
                sys.executable, '-m', 'pip', 'install', '--no-deps',
                '--force-reinstall', str(whls[0])
            ])
            subprocess.check_call([
                sys.executable, '-c',
                'import apache_beam.cli.main as m; assert callable(m.main)'
            ])
            subprocess.check_call([
                sys.executable, '-m', 'pip', 'uninstall', '-y',
                'apache-beam-cli-preview'
            ])
          PY
      - name: Verify PEP 660 Editable Install (`pip install -e`) & Entrypoints
        run: |
          python -m pip install --no-deps --no-build-isolation -e ./sdks/python/cli-preview
          python -c "import apache_beam.cli.main as m; assert callable(m.main)"
          beam --version --json
          beam doctor --json
      - name: Run Full Apache Beam CLI Pytest Suite (`pytest -n auto`)
        run: |
          python -c "import glob, pytest; raise SystemExit(pytest.main(['-n', 'auto', '-v', '-rs', '--import-mode=importlib', *sorted(glob.glob('sdks/python/apache_beam/cli/*_test.py'))]))"

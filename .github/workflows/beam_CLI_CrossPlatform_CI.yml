name: Beam CLI Cross-Platform CI (Linux, Windows, macOS)

on:
  push:
    branches: ['beam-cli-preview']
    paths:
      - 'sdks/python/apache_beam/cli/**'
      - 'sdks/python/cli-preview/**'
      - 'sdks/python/_apache_beam_cli.py'
      - '.github/workflows/beam_CLI_CrossPlatform_CI.yml'
  pull_request:
    paths:
      - 'sdks/python/apache_beam/cli/**'
      - 'sdks/python/cli-preview/**'
      - 'sdks/python/_apache_beam_cli.py'
      - '.github/workflows/beam_CLI_CrossPlatform_CI.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  lint:
    name: Apache Beam Lint & License Gate (ruff + whitespacelint + ASF)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sdks/python/apache_beam/cli
            sdks/python/cli-preview
            sdks/python/_apache_beam_cli.py
            sdks/python/pyproject.toml
            sdks/python/setup.cfg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Apache Beam lint tools
        run: python -m pip install --upgrade pip ruff whitespacelint yapf==0.43.0
      - name: Run Apache Beam ruff check
        run: ruff check sdks/python/apache_beam/cli sdks/python/cli-preview --config sdks/python/pyproject.toml
      - name: Run whitespacelint & ASF license header checks
        run: |
          python - << 'PY'
          import glob, sys
          files = sorted(
              glob.glob('sdks/python/apache_beam/cli/*.py') +
              glob.glob('sdks/python/cli-preview/apache_beam_cli_preview/*.py') +
              glob.glob('sdks/python/cli-preview/*.sh') +
              ['sdks/python/cli-preview/setup.py']
          )
          errs = []
          for f in files:
            raw = open(f, encoding='utf-8').read()
            if 'Licensed to the Apache Software Foundation' not in raw[:1200]:
              errs.append(f'{f}: missing ASF 2.0 license header')
            for i, line in enumerate(raw.splitlines(), 1):
              if line != line.rstrip(' \t'):
                errs.append(f'{f}:{i}: trailing whitespace')
              if '\t' in line:
                errs.append(f'{f}:{i}: tab character')
          for tf in sorted(glob.glob('sdks/python/apache_beam/cli/*_test.py')):
            txt = open(tf, encoding='utf-8').read()
            if 'import unittest' in txt and 'unittest.main' not in txt:
              errs.append(f'{tf}: missing unittest.main()')
          if errs:
            print('\n'.join(errs), file=sys.stderr)
            sys.exit(1)
          print(f'Verified ASF headers, whitespace, and unittest.main() across {len(files)} files.')
          PY

  pytest-cross-platform:
    name: Pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sdks/python/apache_beam/cli
            sdks/python/cli-preview
            sdks/python/_apache_beam_cli.py
            sdks/python/pyproject.toml
            sdks/python/setup.cfg
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Apache Beam & CLI Preview
        run: |
          python -m pip install --upgrade pip
          python -m pip install "apache-beam[yaml,dataframe,gcp]>=2.68.0" pytest duckdb sqlglot jinja2 pyyaml pyarrow fastavro
          python -m pip install --no-deps ./sdks/python/cli-preview
      - name: Verify CLI Entrypoints (`beam --version` & `beam doctor`)
        run: |
          beam --version --json
          beam doctor --json
      - name: Run Full Apache Beam CLI Pytest Suite
        run: |
          python -c "import glob, pytest, sys; raise SystemExit(pytest.main(['-v', '-rs', '--import-mode=importlib', *sorted(glob.glob('sdks/python/apache_beam/cli/*_test.py'))]))"
